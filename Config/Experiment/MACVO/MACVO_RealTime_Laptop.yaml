#
# MAC-VO Real-Time Laptop Profile for IEEE RA-L MAC-VIO Research
# Optimized for high-throughput execution on laptop GPUs (e.g. RTX 2050 / RTX 3050 / RTX 4050)
#
# Key Optimizations:
#   1. mapping: false -> Disables dense 3D point cloud generation (avoids generating 1M+ points in memory)
#   2. UniformKeyframe (freq=3) -> Processes visual keyframes at ~10 Hz instead of 30 Hz (non-keyframes are interpolated)
#   3. num_point: 100 -> Balances covariance-aware tracking with fast backend optimization
#   4. Mixed-precision fp16/bf16 with CUDAGraph acceleration
#

Common:
  device: &device cuda

Odometry:
  name: MACVO-RealTime
  args:
    device: *device
    edgewidth: 32
    num_point: 100 # Balanced keypoint count for fast optimization
    match_cov_default: 0.25
    profile: false
    mapping: false # Turned off dense 3D point cloud generation

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp16
      dec_dtype: bf16
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: ConstantVelocityMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:
  
  postprocess:
    type: MotionInterpolate
    args:
  
  keyframe:
    type: UniformKeyframe
    args:
      keyframe_freq: 3 # Optimize every 3rd frame (10 Hz keyframe rate)
  
  optimizer:
    type: DecoupledVIO_PGO
    args:
      device: cpu
      parallel: false

Data: !include ../../Sequence/TartanAir_example.yaml
Preprocess: !include ../Common/Preprocess.yaml

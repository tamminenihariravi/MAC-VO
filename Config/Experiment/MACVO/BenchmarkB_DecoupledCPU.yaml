# BENCHMARK B: Proposed Fast Formulation
# TartanVO removed (recovering ~1.5 GB VRAM) + Constant Velocity SE(3) Model + Decoupled Constant-Covariance CPU Solver
Common:
  device: &device cuda

Odometry:
  name: BenchmarkB-ProposedDecoupled
  args:
    device: *device
    edgewidth: 32
    num_point: 100
    match_cov_default: 0.25
    profile: false
    mapping: false

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp16
      dec_dtype: bf16
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: ConstantVelocityMotionModel # Replaced heavy TartanVO with Lie SE(3) Constant Velocity
    args:

  outlier:
    type: CovarianceSanityFilter
    args:
  
  postprocess:
    type: MotionInterpolate
    args:
  
  keyframe:
    type: UniformKeyframe
    args:
      keyframe_freq: 3
  
  optimizer:
    type: DecoupledCPU_PGO # Decoupled constant covariance on CPU
    args:
      device: cpu
      parallel: false

Data: !include ../../Sequence/TartanAir_example.yaml
Preprocess: !include ../Common/Preprocess.yaml
